<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚡ CRYPTO IMAGE - مبدل رمزنگاری گیمینگ</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --neon-cyan: #00f0ff;
    --neon-magenta: #ff00e5;
    --neon-purple: #a855f7;
    --neon-green: #00ff88;
    --bg-dark: #05060f;
    --bg-panel: rgba(15, 20, 40, 0.75);
    --border-glow: rgba(0, 240, 255, 0.4);
  }

  html, body {
    min-height: 100vh;
    font-family: 'Vazirmatn', Tahoma, sans-serif;
    background: var(--bg-dark);
    color: #e5e7eb;
    overflow-x: hidden;
    position: relative;
  }

  /* === پس‌زمینه شبکه‌ای نئون === */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0, 240, 255, 0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 240, 255, 0.06) 1px, transparent 1px);
    background-size: 50px 50px;
    perspective: 500px;
    transform: perspective(500px) rotateX(60deg) translateY(-50%);
    animation: gridMove 20s linear infinite;
    z-index: 0;
    pointer-events: none;
  }

  @keyframes gridMove {
    0% { background-position: 0 0; }
    100% { background-position: 0 50px; }
  }

  /* === گلوهای نورانی پس‌زمینه === */
  .glow-orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.5;
    z-index: 0;
    pointer-events: none;
    animation: float 8s ease-in-out infinite;
  }
  .orb-1 { width: 400px; height: 400px; background: var(--neon-cyan); top: -100px; right: -100px; }
  .orb-2 { width: 350px; height: 350px; background: var(--neon-magenta); bottom: -100px; left: -100px; animation-delay: -3s; }
  .orb-3 { width: 300px; height: 300px; background: var(--neon-purple); top: 50%; left: 50%; animation-delay: -6s; opacity: 0.3; }

  @keyframes float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(30px, -30px) scale(1.1); }
  }

  /* === کانتینر اصلی === */
  .container {
    position: relative;
    z-index: 2;
    max-width: 900px;
    margin: 30px auto;
    padding: 35px;
    background: var(--bg-panel);
    border: 1px solid var(--border-glow);
    border-radius: 24px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow:
      0 0 40px rgba(0, 240, 255, 0.15),
      0 0 80px rgba(255, 0, 229, 0.08),
      inset 0 0 60px rgba(0, 240, 255, 0.03);
  }

  /* گوشه‌های تزئینی */
  .container::before, .container::after {
    content: '';
    position: absolute;
    width: 40px;
    height: 40px;
    border: 2px solid var(--neon-cyan);
    filter: drop-shadow(0 0 8px var(--neon-cyan));
  }
  .container::before {
    top: -2px; right: -2px;
    border-left: none; border-bottom: none;
    border-radius: 0 24px 0 0;
  }
  .container::after {
    bottom: -2px; left: -2px;
    border-right: none; border-top: none;
    border-radius: 0 0 0 24px;
  }

  /* === هدر === */
  h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: 30px;
    font-weight: 900;
    text-align: center;
    letter-spacing: 2px;
    background: linear-gradient(90deg, var(--neon-cyan), var(--neon-magenta), var(--neon-cyan));
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shimmer 3s linear infinite;
    filter: drop-shadow(0 0 12px rgba(0, 240, 255, 0.6));
    margin-bottom: 8px;
  }

  @keyframes shimmer {
    to { background-position: 200% center; }
  }

  .subtitle {
    text-align: center;
    color: rgba(0, 240, 255, 0.7);
    font-size: 13px;
    letter-spacing: 1px;
    margin-bottom: 25px;
    font-family: 'Orbitron', sans-serif;
  }

  /* === تب‌ها === */
  .tabs {
    display: flex;
    gap: 12px;
    margin-bottom: 25px;
    position: relative;
  }

  .tab-btn {
    flex: 1;
    padding: 14px;
    background: rgba(0, 240, 255, 0.05);
    color: var(--neon-cyan);
    border: 1px solid rgba(0, 240, 255, 0.3);
    border-radius: 12px;
    cursor: pointer;
    font-size: 15px;
    font-weight: 700;
    font-family: 'Vazirmatn', sans-serif;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
  }

  .tab-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, var(--neon-cyan), var(--neon-magenta));
    opacity: 0;
    transition: opacity 0.3s;
    z-index: -1;
  }

  .tab-btn:hover {
    border-color: var(--neon-cyan);
    box-shadow: 0 0 20px rgba(0, 240, 255, 0.4), inset 0 0 20px rgba(0, 240, 255, 0.1);
    transform: translateY(-2px);
  }

  .tab-btn.active {
    background: linear-gradient(90deg, rgba(0, 240, 255, 0.2), rgba(255, 0, 229, 0.2));
    color: #fff;
    border-color: var(--neon-cyan);
    box-shadow:
      0 0 25px rgba(0, 240, 255, 0.5),
      inset 0 0 20px rgba(0, 240, 255, 0.15);
    text-shadow: 0 0 8px var(--neon-cyan);
  }

  .tab-btn.active::before { opacity: 0.15; }

  /* === پنل‌ها === */
  .panel { display: none; animation: fadeIn 0.4s ease; }
  .panel.active { display: block; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  label {
    display: block;
    margin-bottom: 10px;
    color: var(--neon-cyan);
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.5px;
    text-shadow: 0 0 8px rgba(0, 240, 255, 0.5);
  }

  /* === آپلود فایل سفارشی === */
  .file-zone {
    position: relative;
    border: 2px dashed rgba(0, 240, 255, 0.4);
    border-radius: 14px;
    padding: 30px 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s;
    margin-bottom: 18px;
    background: rgba(0, 240, 255, 0.02);
  }

  .file-zone:hover, .file-zone.dragover {
    border-color: var(--neon-magenta);
    background: rgba(255, 0, 229, 0.05);
    box-shadow: 0 0 25px rgba(255, 0, 229, 0.3), inset 0 0 20px rgba(255, 0, 229, 0.05);
  }

  .file-zone .icon {
    font-size: 42px;
    margin-bottom: 10px;
    display: block;
    filter: drop-shadow(0 0 10px var(--neon-cyan));
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.1); }
  }

  .file-zone .text {
    color: #cbd5e1;
    font-size: 14px;
  }

  .file-zone .filename {
    color: var(--neon-green);
    font-weight: 700;
    margin-top: 8px;
    font-size: 13px;
    text-shadow: 0 0 8px rgba(0, 255, 136, 0.6);
    word-break: break-all;
  }

  #fileInput { display: none; }

  /* === تکست‌اریا === */
  textarea {
    width: 100%;
    min-height: 150px;
    padding: 14px;
    background: rgba(0, 0, 0, 0.4);
    color: var(--neon-green);
    border: 1px solid rgba(0, 240, 255, 0.3);
    border-radius: 12px;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    resize: vertical;
    direction: ltr;
    text-align: left;
    margin-bottom: 15px;
    word-break: break-all;
    transition: all 0.3s;
    box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.5);
  }

  textarea::placeholder { color: rgba(0, 240, 255, 0.3); }

  textarea:focus {
    outline: none;
    border-color: var(--neon-cyan);
    box-shadow:
      0 0 20px rgba(0, 240, 255, 0.3),
      inset 0 0 20px rgba(0, 240, 255, 0.05);
    color: var(--neon-cyan);
  }

  /* === دکمه‌ها === */
  button.action {
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, rgba(0, 240, 255, 0.15), rgba(255, 0, 229, 0.15));
    color: #fff;
    border: 1px solid var(--neon-cyan);
    border-radius: 12px;
    font-size: 16px;
    font-weight: 900;
    font-family: 'Vazirmatn', sans-serif;
    cursor: pointer;
    transition: all 0.3s;
    letter-spacing: 1px;
    position: relative;
    overflow: hidden;
    text-shadow: 0 0 10px var(--neon-cyan);
    box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
  }

  button.action::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
    transition: left 0.5s;
  }

  button.action:hover::before { left: 100%; }

  button.action:hover {
    transform: translateY(-2px);
    box-shadow:
      0 0 30px rgba(0, 240, 255, 0.6),
      0 0 60px rgba(255, 0, 229, 0.3);
    border-color: var(--neon-magenta);
  }

  button.action:active { transform: translateY(0); }

  button.secondary {
    background: rgba(0, 255, 136, 0.1);
    border-color: var(--neon-green);
    color: var(--neon-green);
    text-shadow: 0 0 10px var(--neon-green);
  }

  button.secondary:hover {
    box-shadow: 0 0 30px rgba(0, 255, 136, 0.6);
    border-color: var(--neon-green);
    background: rgba(0, 255, 136, 0.15);
  }

  /* === پیش‌نمایش === */
  .preview {
    margin-top: 20px;
    min-height: 140px;
    border: 1px solid rgba(0, 240, 255, 0.3);
    border-radius: 14px;
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    background:
      repeating-linear-gradient(
        45deg,
        rgba(0, 240, 255, 0.02),
        rgba(0, 240, 255, 0.02) 10px,
        transparent 10px,
        transparent 20px
      );
    color: rgba(0, 240, 255, 0.4);
    font-size: 13px;
    position: relative;
    overflow: hidden;
  }

  .preview::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, transparent 50%, rgba(0, 240, 255, 0.03) 50%);
    background-size: 100% 4px;
    pointer-events: none;
    animation: scan 8s linear infinite;
  }

  @keyframes scan {
    from { background-position: 0 0; }
    to { background-position: 0 100px; }
  }

  .preview img {
    max-width: 100%;
    max-height: 300px;
    border-radius: 10px;
    box-shadow: 0 0 30px rgba(0, 240, 255, 0.4);
    border: 1px solid var(--neon-cyan);
    position: relative;
    z-index: 1;
  }

  /* === پیام‌ها === */
  .msg {
    margin-top: 14px;
    padding: 12px;
    border-radius: 10px;
    text-align: center;
    font-weight: 700;
    display: none;
    font-size: 14px;
    animation: slideIn 0.3s;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.success {
    background: rgba(0, 255, 136, 0.1);
    color: var(--neon-green);
    border: 1px solid var(--neon-green);
    display: block;
    box-shadow: 0 0 20px rgba(0, 255, 136, 0.2);
    text-shadow: 0 0 8px rgba(0, 255, 136, 0.6);
  }

  .msg.error {
    background: rgba(255, 0, 100, 0.1);
    color: #ff4680;
    border: 1px solid #ff4680;
    display: block;
    box-shadow: 0 0 20px rgba(255, 0, 100, 0.2);
  }

  /* === فوتر قفل === */
  .lock {
    text-align: center;
    font-size: 12px;
    color: rgba(0, 240, 255, 0.5);
    margin-top: 25px;
    padding-top: 20px;
    border-top: 1px solid rgba(0, 240, 255, 0.15);
    line-height: 1.8;
    font-family: 'Orbitron', sans-serif;
    letter-spacing: 1px;
  }

  .lock strong { color: var(--neon-cyan); text-shadow: 0 0 8px var(--neon-cyan); }

  /* === اسکرول‌بار سفارشی === */
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.5); }
  ::-webkit-scrollbar-thumb {
    background: linear-gradient(var(--neon-cyan), var(--neon-magenta));
    border-radius: 4px;
  }

  /* === ریسپانسیو === */
  @media (max-width: 600px) {
    .container { margin: 15px; padding: 22px; border-radius: 18px; }
    h1 { font-size: 22px; }
    .tab-btn { font-size: 13px; padding: 12px 8px; }
    .file-zone .icon { font-size: 32px; }
  }
</style>
</head>
<body>

<!-- گلوهای نورانی پس‌زمینه -->
<div class="glow-orb orb-1"></div>
<div class="glow-orb orb-2"></div>
<div class="glow-orb orb-3"></div>

<div class="container">
  <h1>⚡ CRYPTO IMAGE ⚡</h1>
  <p class="subtitle">ENCRYPTED IMAGE CONVERTER • V1.0</p>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('img2code', event)">🔒 ENCRYPT</button>
    <button class="tab-btn" onclick="switchTab('code2img', event)">🔓 DECRYPT</button>
  </div>

  <!-- بخش تصویر به کد -->
  <div id="img2code" class="panel active">
    <label>📁 SELECT IMAGE</label>
    <div class="file-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
      <span class="icon">🎮</span>
      <div class="text">فایل تصویر را اینجا رها کنید یا کلیک کنید</div>
      <div class="filename" id="fileName"></div>
    </div>
    <input type="file" id="fileInput" accept="image/*">

    <button class="action" onclick="imageToCode()">⚡ GENERATE ENCRYPTED CODE</button>

    <div class="msg" id="msg1"></div>

    <label style="margin-top:18px;">🔑 ENCRYPTED CODE</label>
    <textarea id="codeOutput" placeholder="// کد رمزنگاری‌شده اینجا نمایش داده می‌شود..."></textarea>
    <button class="action secondary" onclick="copyCode()">📋 COPY TO CLIPBOARD</button>

    <div class="preview" id="preview1">[ پیش‌نمایش تصویر ]</div>
  </div>

  <!-- بخش کد به تصویر -->
  <div id="code2img" class="panel">
    <label>🔑 ENCRYPTED CODE</label>
    <textarea id="codeInput" placeholder="// کد رمزنگاری‌شده را اینجا بچسبانید..."></textarea>

    <button class="action" onclick="codeToImage()">🔓 DECRYPT TO IMAGE</button>

    <div class="msg" id="msg2"></div>

    <div class="preview" id="preview2">[ پیش‌نمایش تصویر ]</div>
  </div>

  <div class="lock">
    🔐 POWERED BY <strong>XOR ENCRYPTION</strong> • UNIQUE SIGNATURE<br>
    فقط با این برنامه قابل رمزگشایی است
  </div>
</div>

<script>
  // ================== کلید مخفی ==================
  const SECRET_KEY = "X9k#mP2vL7qR4wZ8nB5tY1cF6hJ3dA0s";
  // =================================================

  let currentPreviewSrc = '';

  // درگ و دراپ
  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');

  ['dragenter', 'dragover'].forEach(ev =>
    dropZone.addEventListener(ev, e => {
      e.preventDefault();
      dropZone.classList.add('dragover');
    })
  );
  ['dragleave', 'drop'].forEach(ev =>
    dropZone.addEventListener(ev, e => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
    })
  );
  dropZone.addEventListener('drop', e => {
    const files = e.dataTransfer.files;
    if (files.length > 0) {
      fileInput.files = files;
      showFileName(files[0].name);
    }
  });
  fileInput.addEventListener('change', e => {
    if (e.target.files[0]) showFileName(e.target.files[0].name);
  });

  function showFileName(name) {
    document.getElementById('fileName').textContent = '✓ ' + name;
  }

  // رمزنگاری XOR
  function xorCrypt(data, key) {
    const result = new Uint8Array(data.length);
    for (let i = 0; i < data.length; i++) {
      result[i] = data[i] ^ key.charCodeAt(i % key.length);
    }
    return result;
  }

  function bufferToBase64(buffer) {
    let binary = '';
    const bytes = new Uint8Array(buffer);
    const chunk = 8192;
    for (let i = 0; i < bytes.length; i += chunk) {
      binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
    }
    return btoa(binary);
  }

  function base64ToBuffer(b64) {
    const binary = atob(b64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) {
      bytes[i] = binary.charCodeAt(i);
    }
    return bytes.buffer;
  }

  function switchTab(id, ev) {
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    ev.target.classList.add('active');
  }

  // ============ تصویر به کد ============
  function imageToCode() {
    const file = fileInput.files[0];
    const msg = document.getElementById('msg1');
    msg.className = 'msg';

    if (!file) {
      msg.className = 'msg error';
      msg.textContent = '⚠️ لطفاً ابتدا یک تصویر انتخاب کنید.';
      return;
    }

    const reader = new FileReader();
    reader.onload = e => {
      try {
        const originalBytes = new Uint8Array(e.target.result);
        const mime = file.type || 'image/png';
        const mimeBytes = new TextEncoder().encode(mime);

        const totalLen = 2 + mimeBytes.length + originalBytes.length;
        const pack = new Uint8Array(totalLen);
        pack[0] = (mimeBytes.length >> 8) & 0xFF;
        pack[1] = mimeBytes.length & 0xFF;
        pack.set(mimeBytes, 2);
        pack.set(originalBytes, 2 + mimeBytes.length);

        const encrypted = xorCrypt(pack, SECRET_KEY);
        const finalCode = "ENCIMG1:" + bufferToBase64(encrypted);

        document.getElementById('codeOutput').value = finalCode;
        currentPreviewSrc = URL.createObjectURL(file);
        document.getElementById('preview1').innerHTML =
          `<img src="${currentPreviewSrc}" alt="پیش‌نمایش">`;

        msg.className = 'msg success';
        msg.textContent = '✅ کد رمزنگاری‌شده با موفقیت تولید شد.';
      } catch (err) {
        msg.className = 'msg error';
        msg.textContent = '❌ خطا: ' + err.message;
      }
    };
    reader.readAsArrayBuffer(file);
  }

  function copyCode() {
    const ta = document.getElementById('codeOutput');
    if (!ta.value) {
      alert('ابتدا کدی تولید کنید!');
      return;
    }
    ta.select();
    document.execCommand('copy');
    const msg = document.getElementById('msg1');
    msg.className = 'msg success';
    msg.textContent = '📋 کد در کلیپ‌بورد کپی شد!';
  }

  // ============ کد به تصویر ============
  function codeToImage() {
    const input = document.getElementById('codeInput').value.trim();
    const msg = document.getElementById('msg2');
    const preview = document.getElementById('preview2');
    msg.className = 'msg';
    preview.innerHTML = '[ پیش‌نمایش تصویر ]';

    if (!input) {
      msg.className = 'msg error';
      msg.textContent = '⚠️ لطفاً کد رمز را وارد کنید.';
      return;
    }

    const signature = "ENCIMG1:";
    if (!input.startsWith(signature)) {
      msg.className = 'msg error';
      msg.textContent = '❌ کد نامعتبر! باید با ENCIMG1: شروع شود.';
      return;
    }

    try {
      const b64 = input.substring(signature.length);
      const encryptedBytes = new Uint8Array(base64ToBuffer(b64));
      const decrypted = new Uint8Array(xorCrypt(encryptedBytes, SECRET_KEY));

      const mimeLen = (decrypted[0] << 8) | decrypted[1];
      if (mimeLen <= 0 || mimeLen > 100 || decrypted.length < 2 + mimeLen) {
        throw new Error('ساختار کد نامعتبر است');
      }

      const mime = new TextDecoder().decode(decrypted.subarray(2, 2 + mimeLen));
      const imgBytes = decrypted.subarray(2 + mimeLen);
      if (imgBytes.length === 0) throw new Error('داده تصویر خالی است');

      const blob = new Blob([imgBytes], { type: mime });
      const url = URL.createObjectURL(blob);

      const img = new Image();
      img.onload = () => {
        preview.innerHTML = '';
        preview.appendChild(img);
        msg.className = 'msg success';
        msg.textContent = '✅ تصویر با موفقیت رمزگشایی شد.';
      };
      img.onerror = () => {
        preview.innerHTML = '[ پیش‌نمایش تصویر ]';
        msg.className = 'msg error';
        msg.textContent = '❌ کد نامعتبر یا دستکاری‌شده است.';
      };
      img.src = url;
    } catch (err) {
      msg.className = 'msg error';
      msg.textContent = '❌ خطا: ' + err.message;
    }
  }
</script>

</body>
</html>
